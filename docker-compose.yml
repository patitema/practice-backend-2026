version: '3.8'

services:
  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: survey-api-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=survey_api
      - DB_USERNAME=root
      - DB_PASSWORD=root6535
    depends_on:
      - db
    networks:
      - survey-network

  db:
    image: mysql:8.4
    container_name: survey-api-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root6535
      - MYSQL_DATABASE=survey_api
      - MYSQL_ROOT_HOST=%
    volumes:
      - db-data:/var/lib/mysql
      - ./src/tests/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql
    networks:
      - survey-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: survey-api-pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root6535
    depends_on:
      - db
    networks:
      - survey-network

volumes:
  db-data:
    driver: local

networks:
  survey-network:
    driver: bridge
